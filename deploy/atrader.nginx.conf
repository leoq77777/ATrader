server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Replace with your server's domain or IP before installation.
    server_name YOUR_SERVER_IP;
    ssl_certificate /etc/nginx/atrader-tls/cert.pem;
    ssl_certificate_key /etc/nginx/atrader-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "ATrader";
    auth_basic_user_file /etc/nginx/atrader.htpasswd;
    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
